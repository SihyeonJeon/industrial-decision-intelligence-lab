name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest
      - name: Synthetic smoke run
        run: uv run replenishment-gate run --synthetic --report-dir /tmp/replenishment-gate-smoke

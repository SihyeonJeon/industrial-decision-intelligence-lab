[project]
name = "industrial-decision-intelligence-lab"
version = "0.2.0"
description = "Forecast-to-inventory decision simulation on retail transaction data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pytest>=8.0",
    "ruff>=0.8",
    "scikit-learn>=1.5",
]

[project.urls]
Repository = "https://github.com/SihyeonJeon/industrial-decision-intelligence-lab"

[project.scripts]
decision-lab = "decision_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
